<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0f" />
    <meta
      name="description"
      content="O portfólio antigo de Kefilwe Lourenço foi arquivado e redireciona para a nova versão em kefilwe.dev."
    />
    <meta property="og:title" content="Portfólio arquivado | Kefilwe Lourenço" />
    <meta
      property="og:description"
      content="Este portfólio antigo foi arquivado. Acesse a nova versão com projetos, experiências e caminhos em tecnologia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kefilwe.dev/" />
    <link rel="canonical" href="https://kefilwe.dev/" />
    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
    <title>Portfólio arquivado | Kefilwe Lourenço</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap");

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: #070a0f;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background: #070a0f;
        color: #edf2ff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      a {
        color: inherit;
        font: inherit;
      }

      ::selection {
        background: #4ade80;
        color: #07110a;
      }

      :focus-visible {
        outline: 3px solid #86efac;
        outline-offset: 5px;
        border-radius: 0.6rem;
      }

      .archive-page {
        position: relative;
        isolation: isolate;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 4vw, 3rem);
        background:
          radial-gradient(circle at 50% 12%, rgba(74, 222, 128, 0.16), transparent 24rem),
          linear-gradient(145deg, #070a0f 0%, #0d121b 58%, #05070a 100%);
      }

      .archive-page::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, #000 0%, transparent 76%);
      }

      .archive-page::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.12;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .archive-hero {
        width: min(100%, 760px);
        display: grid;
        justify-items: center;
        gap: 1.25rem;
        text-align: center;
      }

      .archive-kicker {
        margin: 0;
        color: #4ade80;
        font: 700 0.78rem/1 JetBrains Mono, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .archive-hero h1 {
        max-width: 11ch;
        margin: 0;
        color: #f8fbff;
        font: 700 clamp(3.2rem, 11vw, 7rem) / 0.9 Fraunces, Georgia, serif;
        letter-spacing: 0;
      }

      .archive-copy {
        max-width: 42rem;
        margin: 0;
        color: #b9c3d6;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.75;
      }

      .archive-primary {
        min-height: 3.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(74, 222, 128, 0.72);
        border-radius: 999px;
        background: #4ade80;
        color: #061109;
        font-weight: 800;
        margin-top: 0.4rem;
        padding: 0.9rem 1.35rem;
        text-decoration: none;
        box-shadow: 0 18px 44px rgba(74, 222, 128, 0.22);
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .archive-primary:hover {
        transform: translateY(-2px);
        background: #86efac;
        box-shadow: 0 24px 52px rgba(74, 222, 128, 0.28);
      }

      .archive-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem 1rem;
        margin-top: 0.3rem;
      }

      .archive-links a {
        min-height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(74, 222, 128, 0.44);
        color: #d9e2f1;
        font: 800 0.78rem/1 JetBrains Mono, monospace;
        text-decoration: none;
        transition: color 0.18s ease, border-color 0.18s ease;
      }

      .archive-links a:hover {
        border-color: #86efac;
        color: #86efac;
      }

      @media (max-width: 640px) {
        .archive-page {
          align-items: center;
          padding-inline: 1rem;
        }

        .archive-hero {
          gap: 1rem;
        }

        .archive-hero h1 {
          max-width: 10ch;
        }

        .archive-copy {
          max-width: 31rem;
        }

        .archive-primary {
          width: min(100%, 22rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="archive-page" aria-labelledby="archive-title">
      <section class="archive-hero">
        <p class="archive-kicker">Kefilwe Lourenço</p>
        <h1 id="archive-title">Este portfólio foi arquivado.</h1>
        <p class="archive-copy">
          Minha trajetória evoluiu. Agora meus projetos, experiências e caminhos em tecnologia
          estão reunidos em uma nova versão do meu portfólio.
        </p>

        <a class="archive-primary" href="https://kefilwe.dev/">Acessar novo portfólio</a>

        <nav class="archive-links" aria-label="Links sociais">
          <a href="https://github.com/KefilweLourenco" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/kefilwe-lourenco/" target="_blank" rel="noreferrer">LinkedIn</a>
          <a href="mailto:kefilwebr@hotmail.com">E-mail</a>
        </nav>
      </section>
    </main>

    <script>
      window.setTimeout(function () {
        window.location.assign("https://kefilwe.dev/");
      }, 5000);
    </script>
  </body>
</html>
